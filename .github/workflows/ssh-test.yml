
name: Test VPS SSH Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssh:
    name: Test SSH Connection
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Diagnose VPS connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "GitHub runner public IP:"
          curl -fsS --max-time 10 https://api.ipify.org
          echo ""

          echo "Checking VPS host configuration:"
          if [ "$VPS_HOST" = "145.24.237.27" ]; then
            echo "VPS_HOST is correct"
          else
            echo "::error::VPS_HOST does not match the expected VPS"
            exit 1
          fi

          echo "Checking TCP port 80:"
          if timeout 15 bash -c 'echo > /dev/tcp/"$1"/80' _ "$VPS_HOST"; then
            echo "Port 80 is reachable"
          else
            echo "::error::Port 80 is NOT reachable"
            exit 1
          fi

      - name: Test SSH authentication
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p 80 \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" \
              'whoami && hostname'
