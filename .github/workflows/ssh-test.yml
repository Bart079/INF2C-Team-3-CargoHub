name: Test VPS SSH Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssh:
    name: Test SSH Connection
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Diagnose VPS connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" \
              'whoami && hostname'
