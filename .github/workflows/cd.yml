name: CargoHub CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: cargohub-production
  cancel-in-progress: false

jobs:
  ci:
    name: Verify release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish Docker image
    needs: ci
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./CargoHub_refactored/CargoHub_refact
          file: ./CargoHub_refactored/CargoHub_refact/Dockerfile
          push: true
          tags: ghcr.io/bart079/inf2c-team-3-cargohub:${{ github.sha }}

  
  deploy:
    name: Deploy to Linux VPS
    needs: publish
    if: vars.ENABLE_VPS_DEPLOYMENT == 'true'
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy production Compose file
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            'mkdir -p ~/cargohub'

          scp -o BatchMode=yes \
            compose.production.yaml \
            "$VPS_USER@$VPS_HOST:cargohub/compose.production.yaml"

      - name: Deploy Docker image
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE: ghcr.io/bart079/inf2c-team-3-cargohub:${{ github.sha }}
        run: |
          ssh -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            sh -s -- "$IMAGE" <<'EOF'
          set -eu

          IMAGE="$1"
          cd "$HOME/cargohub"

          CARGOHUB_IMAGE="$IMAGE" \
            docker compose -f compose.production.yaml pull api

          CARGOHUB_IMAGE="$IMAGE" \
            docker compose -f compose.production.yaml up -d --no-deps api

          CARGOHUB_IMAGE="$IMAGE" \
            docker compose -f compose.production.yaml ps
          EOF

