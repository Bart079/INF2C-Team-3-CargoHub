name: Test GHCR Publication

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-test:
    name: Test GHCR Publication
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./CargoHub_refactored/CargoHub_refact
          file: ./CargoHub_refactored/CargoHub_refact/Dockerfile
          push: true
          tags: ghcr.io/bart079/inf2c-team-3-cargohub:test-${{ github.sha }}
